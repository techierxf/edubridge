<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-BRIDGE | Staff Login</title>
    <link rel="stylesheet" href="staff_login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-side" aria-label="Staff login">
            <div class="login-content">
                <p class="eyebrow">EDU-BRIDGE STAFF PORTAL</p>
                <h1>STAFF LOGIN</h1>

                <form class="login-form" id="staffLoginForm">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" autocomplete="username" required>

                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>

                    <button type="submit" class="enter-button">ENTER</button>
                    <p id="loginMessage"></p>
                </form>

                <a class="back-link" href="login_page.html">← Back to portal selection</a>
            </div>
        </section>

        <section class="welcome-side" aria-label="Welcome to EDU-BRIDGE">
            <div class="welcome-image" role="img" aria-label="EDU-BRIDGE welcome artwork"></div>
        </section>
    </main>
    
<script>
document.getElementById("staffLoginForm")
    .addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    message.textContent = "Logging in...";

    try {
       const response = await fetch("/api/staff/login", {
    method: "POST",
    credentials: "same-origin",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        email: email,
        password: password
    })
});

        const result = await response.json();

        if (response.ok) {
            message.textContent = result.message;
            message.style.color = "green";

            window.location.href = "staff_dashboard.html";

        } else {
            message.textContent =
                result.message || "Invalid email or password.";

            message.style.color = "red";
        }

    } catch (error) {
        console.error(error);
        message.textContent = "Cannot connect to the server.";
        message.style.color = "red";
    }
});
</script>

</body>
</html>
