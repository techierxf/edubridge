<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-BRIDGE | Choose Your Portal</title>
    <link rel="stylesheet" href="login_page.css">
</head>
<body>
    <main class="portal-page">
        <section class="portal-choice" aria-labelledby="page-title">
            <div class="choice-content">
                <p class="eyebrow">EDU-BRIDGE STUDENT ENROLLMENT SYSTEM</p>
                <h1 id="page-title">WELCOME TO<br>EDU-BRIDGE</h1>
                <p class="intro">Choose your portal to continue.</p>

                <div class="role-list">
                    <div class="role-block">
                        <h2>STUDENT PORTAL</h2>
                        <a class="role-button student-button" href="student_login.html">
                            LOGIN AS STUDENT
                        </a>
                    </div>

                    <div class="role-block">
                        <h2>STAFF PORTAL</h2>
                        <a class="role-button staff-button" href="staff_login.html">
                           LOGIN AS STAFF
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="welcome-side" aria-label="Welcome to EDU-BRIDGE">
            <div class="welcome-image" role="img" aria-label="EDU-BRIDGE welcome artwork"></div>
        </section>
    </main>
</body>
</html>
