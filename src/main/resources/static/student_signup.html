
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-BRIDGE | Create Student Account</title>
    <link rel="stylesheet" href="student_signup.css">
</head>
<body>
    <main class="signup-page">
        <section class="signup-side" aria-label="Student account registration">
            <div class="signup-content">
                <p class="eyebrow">EDU-BRIDGE STUDENT PORTAL</p>
                <h1>CREATE YOUR<br>ACCOUNT</h1>
                <p class="intro">Create an account to continue to student enrollment.</p>

                <!-- BACKEND INTEGRATION:
                     Spring Boot should receive this form and create a student account
                     in MySQL. Replace action="#" with the route agreed on by the team.
                     Confirm field/property names with the backend team.
                -->
                <form class="signup-form"
                      id="studentSignupForm"
                      action="#"
                      method="post">

                    <label for="full-name">FULL NAME</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <label for="email">EMAIL ADDRESS</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                    <label for="password">PASSWORD</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button type="submit" class="create-button">
                        CREATE ACCOUNT
                    </button>
                </form>

                <p class="login-prompt">
                    Already have an account?
                    <a href="student_login.html">Log In</a>
                </p>

                <a class="back-link" href="student_login.html">
                    ← Back to Student Login
                </a>
            </div>
        </section>

        <section class="welcome-side" aria-label="Welcome to EDU-BRIDGE">
            <div class="welcome-image"
                 role="img"
                 aria-label="EDU-BRIDGE welcome artwork"></div>
        </section>
    </main>
    
<script>
document.getElementById("studentSignupForm")
    .addEventListener("submit", async function(event) {

    event.preventDefault();
    
    

    const fullName = document.getElementById("full-name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    try {
        const response = await fetch("/api/students/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fullName: fullName,
                email: email,
                password: password,
                confirmPassword: confirmPassword
            })
        });

        const result = await response.json();

        if (response.ok) {
            alert(result.message);
            window.location.href = "student_login.html";
        } else {
            alert(result.message);
        }

    } catch (error) {
        alert("Cannot connect to the server. Please try again.");
        console.error(error);
    }
});
</script>


</body>
</html>
